<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" routerLink="/dashboard">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="5" cy="12" r="3" />
        <circle cx="19" cy="6" r="3" />
        <circle cx="19" cy="18" r="3" />
        <path d="M8 12h3a4 4 0 0 0 4-4V7.5M11 12a4 4 0 0 1 4 4v.5" />
      </svg>
      <span>Repo Sync</span>
    </a>

    <div class="account">
      @if (session.isConnected()) {
        <span class="chip">
          <span class="dot" aria-hidden="true"></span>{{ session.username() ?? 'Connected' }}
        </span>
      } @else {
        <span class="chip off">Not connected</span>
      }
    </div>

    <nav aria-label="Primary">
      <a routerLink="/dashboard" routerLinkActive="active" ariaCurrentWhenActive="page">Overview</a>
      <a routerLink="/repositories" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Repositories</a
      >
      <a routerLink="/pull-requests" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Pull requests</a
      >
      <a routerLink="/connection" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Connection</a
      >
    </nav>
  </div>
</header>

<main id="main" tabindex="-1">
  <router-outlet />
</main>
