<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" routerLink="/dashboard">
      <span class="icon" aria-hidden="true">hub</span>
      <span>Repo Sync</span>
    </a>

    <nav aria-label="Primary">
      <a routerLink="/dashboard" routerLinkActive="active">Overview</a>
      <a routerLink="/repositories" routerLinkActive="active">Repositories</a>
      <a routerLink="/pull-requests" routerLinkActive="active">Pull requests</a>
      <a routerLink="/connection" routerLinkActive="active">Connection</a>
    </nav>

    <div class="account">
      @if (session.isConnected()) {
        <span class="chip">
          <span class="icon" aria-hidden="true">account_circle</span>{{ session.username() ?? 'Connected' }}
        </span>
      } @else {
        <span class="chip">Not connected</span>
      }
    </div>
  </div>
</header>

<main>
  <router-outlet />
</main>
