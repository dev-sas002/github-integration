server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The app is prerendered to directories (`/dashboard/index.html`), so nginx
  # 301s `/dashboard` to `/dashboard/`. Absolute redirects would name the
  # container's own port (8080) rather than the published one, sending the
  # browser somewhere it cannot reach — so redirects stay relative.
  absolute_redirect off;
  port_in_redirect off;

  # Hashed bundles are immutable; the entry point must never be cached or a
  # deploy leaves browsers on the previous build.
  location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # The API is proxied rather than called cross-origin, so the browser makes
  # same-origin requests and no CORS preflight is involved.
  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Client-side routing: unknown paths are application routes, not 404s.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store";
  }
}
